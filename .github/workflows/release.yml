name: Publicar Trueque Noir

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validar etiqueta, manifiesto y código
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check

      - name: Pruebas de las reglas
        run: npm test

      - name: Empaquetar
        run: |
          mkdir -p dist
          # Solo lo que Foundry necesita: sin pruebas, herramientas ni la captura del README.
          zip -r dist/trueque-noir.zip system.json trueque-noir.mjs module templates styles fonts lang assets data LICENSE README.md CHANGELOG.md CONTENIDO.md
          cp system.json dist/system.json
          unzip -l dist/trueque-noir.zip | tail -1

      - name: Notas de la versión
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0==v{p=1;next} /^## /{p=0} p' CHANGELOG.md > dist/notas.md
          test -s dist/notas.md || echo "Versión $version." > dist/notas.md

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/trueque-noir.zip dist/system.json --title "Trueque Noir $GITHUB_REF_NAME" --notes-file dist/notas.md
