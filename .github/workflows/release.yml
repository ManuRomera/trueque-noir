name: Publicar Trueque Noir

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar sintaxis y coherencia del paquete
        run: |
          node --check trueque-noir.mjs
          for file in module/*.mjs tools/*.mjs; do node --check "$file"; done
          node tools/check.mjs

      - name: Preparar paquete
        run: |
          mkdir -p dist/trueque-noir
          # Trueque.png es la captura del README: no debe viajar en el paquete instalable.
          rsync -a --exclude '.git' --exclude '.github' --exclude 'dist' --exclude '*.zip' --exclude 'Trueque.png' ./ dist/trueque-noir/
          cd dist
          zip -r trueque-noir.zip trueque-noir
          cp trueque-noir/system.json system.json

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/trueque-noir.zip
            dist/system.json
